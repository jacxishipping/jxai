name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: moe_engine test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake g++

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run offline verification suite
        run: ./build/moe_engine test

      - name: jxai_term smoke
        run: |
          test -x ./build/jxai_term
          ./build/jxai_term --help | grep -q "terminal client"
          # Non-TTY must refuse cleanly (exit 1), not crash.
          set +e
          ./build/jxai_term --skip-wizard </dev/null >/dev/null 2>term.err
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -qi "TTY\|tty\|interactive" term.err

  web:
    name: web npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Offline unit tests
        # Live API cases skip without MOE_MODEL; offline gates must pass.
        run: npm test
