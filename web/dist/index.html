<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JXAI API Server</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #13131f; border: 1px solid #1e293b; border-radius: 16px; padding: 40px; max-width: 480px; text-align: center; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    .badge { display: inline-block; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 14px; font-size: 12px; color: #60a5fa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JXAI Inference Engine</h1>
    <p>The JXAI backend API is running. The Open WebUI frontend provides the user interface.</p>
    <div class="badge">API v2.0 • Backend Service</div>
  </div>
</body>
</html>
